<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMIXXER - 영상 검색</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <div class="container">
        <h1>VIDEO ARCHIVE</h1>

        <div class="search-wrapper">
            <input type="text" id="searchInput" class="main-search" placeholder="영상 제목을 검색해보세요...">
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <span class="filter-label">Publishers</span>
                <div class="accordion-container" id="channelList">
                    </div>
            </div>

            <hr class="divider">

            <div class="filter-group">
                <span class="filter-label">Keywords & Type</span>
                <div class="accordion-container" id="keywordList">
                    </div>
            </div>

            <hr class="divider">

        <div class="filter-group">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="filter-label" style="margin-bottom:0;">Date Range</span>
                <button class="btn-reset" id="resetDate">초기화</button>
            </div>
            <div class="date-container" style="margin-top: 10px;">
                <input type="date" id="dateStart" class="date-input">
                <span class="date-separator">~</span>
                <input type="date" id="dateEnd" class="date-input">
            </div>
        </div>

        <div class="result-info">
            검색 결과 <span class="result-count-num" id="resultCount">0</span>개
        </div>

        <div class="product-grid" id="videoList"></div>
        
        <footer class="footer">
            by 엔믹서기
        </footer>
    </div>

<script src="static/video.js"></script>
</body>
</html>
